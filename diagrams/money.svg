<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="576" viewBox="0 0 1320 576" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How the money moves in Flick</title>
<desc id="d">Payers approve on PayPal's page as a guest, with a flick from a saved PayPal when signed in, or by themselves under a cap. Every payment is captured into Flick's PayPal account, then paid on to billers, stores and friends with PayPal Payouts, or refunded. Friends not on Flick pay a PayPal invoice.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8e8e93"/></marker>
<marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8e8e93"/></marker>
</defs>
<rect x="0" y="0" width="1320" height="576" rx="24" fill="#0b0b0d" stroke="#0b0b0d" stroke-width="1"/>
<text x="32" y="56" font-size="26" font-weight="750" fill="#f5f5f7" text-anchor="start">How the money moves</text>
<text x="32" y="84" font-size="13" font-weight="400" fill="#c7c7cc" text-anchor="start">Every payment is a PayPal payment: captured into Flick's account first, then paid on to whoever is owed with a payout.</text>
<text x="32" y="124" font-size="11" font-weight="700" fill="#8e8e93" text-anchor="start" letter-spacing="1.2">WHO PAYS, AND HOW THEY APPROVE</text>
<text x="480" y="124" font-size="11" font-weight="700" fill="#8e8e93" text-anchor="start" letter-spacing="1.2">IN THE MIDDLE</text>
<text x="908" y="124" font-size="11" font-weight="700" fill="#8e8e93" text-anchor="start" letter-spacing="1.2">WHO GETS PAID · A PAYOUT, OR A REFUND</text>
<rect x="32" y="140" width="360" height="72" rx="14" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1"/>
<text x="48" y="164" font-size="14" font-weight="650" fill="#f5f5f7" text-anchor="start">A guest</text>
<text x="48" y="184" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Approves on PayPal's own page</text>
<text x="48" y="202" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Orders v2: create → approve → capture</text>
<rect x="32" y="226" width="360" height="72" rx="14" fill="#1c1c1e" stroke="#36D1DC66" stroke-width="1"/>
<circle cx="51" cy="246" r="5" fill="#36D1DC"/>
<text x="62" y="250" font-size="14" font-weight="650" fill="#f5f5f7" text-anchor="start">Signed in: a flick</text>
<text x="48" y="270" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Pays from the saved PayPal, no page</text>
<text x="48" y="288" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Vault v3 token, payer-initiated</text>
<rect x="32" y="312" width="360" height="90" rx="14" fill="#1c1c1e" stroke="#4ADE8066" stroke-width="1"/>
<circle cx="51" cy="332" r="5" fill="#4ADE80"/>
<text x="62" y="336" font-size="14" font-weight="650" fill="#f5f5f7" text-anchor="start">By itself</text>
<text x="48" y="356" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Autopilot's week, under its weekly cap</text>
<text x="48" y="374" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">A friend's ask, under your limit for them</text>
<text x="48" y="392" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Vault v3 token, merchant-initiated</text>
<rect x="32" y="416" width="360" height="72" rx="14" fill="#1c1c1e" stroke="#F472B666" stroke-width="1"/>
<circle cx="51" cy="436" r="5" fill="#F472B6"/>
<text x="62" y="440" font-size="14" font-weight="650" fill="#f5f5f7" text-anchor="start">A friend not on Flick</text>
<text x="48" y="460" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Pays a PayPal invoice for their share</text>
<text x="48" y="478" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Nudge sends PayPal's own reminder</text>
<rect x="480" y="140" width="340" height="348" rx="18" fill="#1c1c1e" stroke="#0A84FF99" stroke-width="1.5"/>
<circle cx="504" cy="170" r="6" fill="#0A84FF"/>
<text x="518" y="175" font-size="17" font-weight="700" fill="#f5f5f7" text-anchor="start">Flick's PayPal account</text>
<text x="500" y="206" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">The sandbox REST app's business account.</text>
<text x="500" y="224" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Every payment is captured here first.</text>
<text x="500" y="252" font-size="12.5" font-weight="650" fill="#f5f5f7" text-anchor="start">Never twice</text>
<text x="500" y="271" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Each write to PayPal carries a</text>
<text x="500" y="289" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">PayPal-Request-Id, so a retry or a</text>
<text x="500" y="307" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">reloaded return page can't repeat it.</text>
<text x="500" y="335" font-size="12.5" font-weight="650" fill="#f5f5f7" text-anchor="start">One at a time</text>
<text x="500" y="354" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">A workspace's changes run in order;</text>
<text x="500" y="372" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">a friend's request is marked paying</text>
<text x="500" y="390" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">before PayPal is called.</text>
<text x="500" y="418" font-size="12.5" font-weight="650" fill="#f5f5f7" text-anchor="start">Checked first</text>
<text x="500" y="437" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Amounts come from Lens's checked read,</text>
<text x="500" y="455" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">the server's prices, or the plan you saw.</text>
<rect x="908" y="140" width="380" height="90" rx="14" fill="#1c1c1e" stroke="#4ADE8066" stroke-width="1"/>
<circle cx="927" cy="160" r="5" fill="#4ADE80"/>
<text x="938" y="164" font-size="14" font-weight="650" fill="#f5f5f7" text-anchor="start">Billers</text>
<text x="924" y="184" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">A bill Lens read: the same day</text>
<text x="924" y="202" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Autopilot's week: each on its day</text>
<text x="924" y="220" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">A business on Flick: its own PayPal</text>
<rect x="908" y="244" width="380" height="54" rx="14" fill="#1c1c1e" stroke="#FF8A5B66" stroke-width="1"/>
<circle cx="927" cy="264" r="5" fill="#FF8A5B"/>
<text x="938" y="268" font-size="14" font-weight="650" fill="#f5f5f7" text-anchor="start">Stores</text>
<text x="924" y="288" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Scout's basket, priced by the server</text>
<rect x="908" y="312" width="380" height="72" rx="14" fill="#1c1c1e" stroke="#60A5FA66" stroke-width="1"/>
<circle cx="927" cy="332" r="5" fill="#60A5FA"/>
<text x="938" y="336" font-size="14" font-weight="650" fill="#f5f5f7" text-anchor="start">Friends</text>
<text x="924" y="356" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Flick Chat: to the PayPal email</text>
<text x="924" y="374" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">they signed in with</text>
<rect x="908" y="398" width="380" height="72" rx="14" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1"/>
<text x="924" y="422" font-size="14" font-weight="650" fill="#f5f5f7" text-anchor="start">Back to the payer</text>
<text x="924" y="442" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Skip a payment after approving:</text>
<text x="924" y="460" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">refunded from its capture</text>
<text x="910" y="498" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="start">A payout goes to an email. A business registered on Flick is paid</text>
<text x="910" y="516" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="start">at the PayPal it signed in with; otherwise a payee you added, a</text>
<text x="910" y="534" font-size="12" font-weight="400" fill="#8e8e93" text-anchor="start">PayPal handle on the bill, or a placeholder that waits, unclaimed.</text>
<line x1="398" y1="176" x2="474" y2="176" stroke="#8e8e93" stroke-width="1.6" marker-end="url(#a)"/>
<text x="436" y="168" font-size="10.5" font-weight="400" fill="#8e8e93" text-anchor="middle">capture</text>
<line x1="398" y1="262" x2="474" y2="262" stroke="#8e8e93" stroke-width="1.6" marker-end="url(#a)"/>
<text x="436" y="254" font-size="10.5" font-weight="400" fill="#8e8e93" text-anchor="middle">charge</text>
<line x1="398" y1="357" x2="474" y2="357" stroke="#8e8e93" stroke-width="1.6" marker-end="url(#a)"/>
<text x="436" y="349" font-size="10.5" font-weight="400" fill="#8e8e93" text-anchor="middle">charge</text>
<line x1="398" y1="452" x2="474" y2="452" stroke="#8e8e93" stroke-width="1.6" marker-end="url(#a)"/>
<text x="436" y="444" font-size="10.5" font-weight="400" fill="#8e8e93" text-anchor="middle">invoice paid</text>
<line x1="826" y1="185" x2="902" y2="185" stroke="#8e8e93" stroke-width="1.6" marker-end="url(#a)"/>
<text x="864" y="177" font-size="10.5" font-weight="400" fill="#8e8e93" text-anchor="middle">payout</text>
<line x1="826" y1="271" x2="902" y2="271" stroke="#8e8e93" stroke-width="1.6" marker-end="url(#a)"/>
<text x="864" y="263" font-size="10.5" font-weight="400" fill="#8e8e93" text-anchor="middle">payout</text>
<line x1="826" y1="348" x2="902" y2="348" stroke="#8e8e93" stroke-width="1.6" marker-end="url(#a)"/>
<text x="864" y="340" font-size="10.5" font-weight="400" fill="#8e8e93" text-anchor="middle">payout</text>
<line x1="826" y1="434" x2="902" y2="434" stroke="#8e8e93" stroke-width="1.6" marker-end="url(#a)"/>
<text x="864" y="426" font-size="10.5" font-weight="400" fill="#8e8e93" text-anchor="middle">refund</text>
</svg>
