<text x="652" y="124" font-size="11" font-weight="700" fill="#8e8e93" text-anchor="start" letter-spacing="1.2">RAILWAY · NODE 22, NO DEPENDENCIES</text>
<text x="1072" y="124" font-size="11" font-weight="700" fill="#8e8e93" text-anchor="start" letter-spacing="1.2">SERVICES</text>
