<text x="48" y="306" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">~30 a second, read on the phone</text>
<text x="48" y="324" font-size="12" font-weight="400" fill="#c7c7cc" text-anchor="start">Frames never leave the device</text>
