<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Flick's architecture</title>
<desc id="d">The installed app talks to a Next.js site on Vercel, which forwards /api/* to a dependency-free Node backend on Railway. The backend runs Flick's six agents (Lens, Autopilot, Splitter, Nudge, Scout and Safe), Flick Chat and Ask Flick, keeps each person's workspace as JSON on a volume, and calls PayPal's REST APIs, an AI model, Channel3, Frankfurter and the browsers' push services.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8e8e93"/></marker>
<marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8e8e93"/></marker>
</defs>
<rect x="0" y="0" width="1320" height="790" rx="24" fill="#0b0b0d" stroke="#0b0b0d" stroke-width="1"/>
<text x="32" y="56" font-size="26" font-weight="750" fill="#f5f5f7" text-anchor="start">Flick</text>
<text x="104" y="56" font-size="18" font-weight="500" fill="#8e8e93" text-anchor="start">how it fits together</text>
<text x="32" y="84" font-size="13" font-weight="400" fill="#c7c7cc" text-anchor="start">The browser only talks to the site. Every secret, every agent and every PayPal call lives in one Node backend.</text>
<text x="32" y="124" font-size="11" font-weight="700" fill="#8e8e93" text-anchor="start" letter-spacing="1.2">YOUR PHONE OR LAPTOP</text>
